[package]
name = "word-overlay"
version = "0.1.0"
description = "Маленький оверлей зі словами поверх ігор"
authors = ["vlad"]
edition = "2021"

[lib]
name = "word_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-store = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
